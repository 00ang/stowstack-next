<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ambient dither backgrounds</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E0E0E5; padding: 28px; }
  .sheet { display: flex; flex-wrap: wrap; gap: 24px; }
  .ad { width: 1080px; height: 1080px; position: relative; overflow: hidden; background: #93AFE7; flex: none; color: #16161A; font-family: Manrope, system-ui, sans-serif; }
  .ad img { width: 100%; height: 100%; object-fit: cover; object-position: center top; image-rendering: pixelated; display: block; }
  .logo { position: absolute; top: 40px; left: 48px; display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 84px; letter-spacing: -0.035em; line-height: 1; }
  .pane { position: absolute; left: 48px; right: 48px; bottom: 48px; background: #fff; border: 1px solid #121214; }
  h1 { font-weight: 800; font-size: 64px; letter-spacing: -0.04em; line-height: .96; padding: 28px 32px 32px; }
</style>
</head>
<body>
<div class="sheet">
  <article class="ad" data-name="tulips-as-sky"><img src="../assets/ambient-dither/tulips-1440.png" alt="" /><div class="logo"><svg width="108" height="108" viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="54" width="66" height="56" fill="#16161A"/><rect x="16" y="18" width="12" height="42" fill="#16161A"/><rect x="34" y="8" width="12" height="52" fill="#16161A"/><rect x="52" y="14" width="12" height="46" fill="#16161A"/><rect x="70" y="24" width="12" height="36" fill="#16161A"/><rect x="82" y="60" width="24" height="14" fill="#16161A"/></svg>StorageAds</div><div class="pane"><h1>Ads that feel like instruments.</h1></div></article>
  <article class="ad" data-name="mountain-as-sky"><img src="../assets/ambient-dither/mountain-1440.png" alt="" /><div class="logo"><svg width="108" height="108" viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="54" width="66" height="56" fill="#16161A"/><rect x="16" y="18" width="12" height="42" fill="#16161A"/><rect x="34" y="8" width="12" height="52" fill="#16161A"/><rect x="52" y="14" width="12" height="46" fill="#16161A"/><rect x="70" y="24" width="12" height="36" fill="#16161A"/><rect x="82" y="60" width="24" height="14" fill="#16161A"/></svg>StorageAds</div><div class="pane"><h1>Ads that feel like instruments.</h1></div></article>
  <article class="ad" data-name="forest-as-sky"><img src="../assets/ambient-dither/forest-1440.png" alt="" /><div class="logo"><svg width="108" height="108" viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="54" width="66" height="56" fill="#16161A"/><rect x="16" y="18" width="12" height="42" fill="#16161A"/><rect x="34" y="8" width="12" height="52" fill="#16161A"/><rect x="52" y="14" width="12" height="46" fill="#16161A"/><rect x="70" y="24" width="12" height="36" fill="#16161A"/><rect x="82" y="60" width="24" height="14" fill="#16161A"/></svg>StorageAds</div><div class="pane"><h1>Ads that feel like instruments.</h1></div></article>
  <article class="ad" data-name="beach-as-sky"><img src="../assets/ambient-dither/beach-1440.png" alt="" /><div class="logo"><svg width="108" height="108" viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="54" width="66" height="56" fill="#16161A"/><rect x="16" y="18" width="12" height="42" fill="#16161A"/><rect x="34" y="8" width="12" height="52" fill="#16161A"/><rect x="52" y="14" width="12" height="46" fill="#16161A"/><rect x="70" y="24" width="12" height="36" fill="#16161A"/><rect x="82" y="60" width="24" height="14" fill="#16161A"/></svg>StorageAds</div><div class="pane"><h1>Ads that feel like instruments.</h1></div></article>
</div>
</body>
</html>
